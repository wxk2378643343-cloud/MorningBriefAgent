[package]
name = "morningbrief-desktop"
version = "0.1.0"
description = "Local-first MorningBrief desktop workbench"
authors = ["MorningBriefAgent"]
edition = "2021"

[lib]
name = "morningbrief_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
