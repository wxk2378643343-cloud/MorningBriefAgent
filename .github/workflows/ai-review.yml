name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AI Code Review (DeepSeek / Kimi / OpenAI 兼容)
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 1. API 密钥：在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置
          OPENAI_API_KEY: ${{ secrets.AI_API_KEY }}
          
          # 2. 接口端点（默认使用 DeepSeek）
          OPENAI_API_ENDPOINT: https://api.deepseek.com/v1
          MODEL: deepseek-flash
          
          # 如需切换为 Kimi，将上面两行改为：
          # OPENAI_API_ENDPOINT: https://api.moonshot.cn/v1
          # MODEL: moonshot-v1-32k
          
          LANGUAGE: Chinese
          PROMPT: "请以资深架构师的视角，对本次 PR 的代码改动进行严格的代码审查。重点检查：1. 潜在的 Bug、并发隐患与边界条件；2. 性能与安全性漏洞；3. 架构分层规范（遵循项目 AGENTS.md 规范）；4. 提供具体的改进建议与优化代码示例。"
